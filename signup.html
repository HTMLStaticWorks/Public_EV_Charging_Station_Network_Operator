<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport" />
    <meta content="#08130f" name="theme-color" />
    <meta
        content="VoltGrid public EV charging network — discover nearby chargers, start and track charging sessions, manage payment methods and review billing."
        name="description" />
    <title>VoltGrid — Sign Up</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet">
    <link
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2313b879'/%3E%3Cpath d='M35 8 17 36h13l-3 20 20-29H34z' fill='%23052118'/%3E%3C/svg%3E"
        rel="icon" />
</head>

<body>


    <section class="page active" id="signup">
        <div class="auth-page">
            <div class="auth-controls" aria-label="Login page controls"><button class="nav-control" id="authRTL" type="button">RTL</button><button class="nav-control" id="authTheme" type="button"><i class="fa-solid fa-moon"></i></button></div>
            <div class="auth-card registering" id="authCard">
                <div class="auth-brand"><a aria-label="VoltGrid home" class="brand auth-logo-link"
                        href="index.html"><span class="logo"><i
                                class="fa-solid fa-bolt"></i></span><span>VoltGrid</span></a></div>
                <div class="center"><span class="eyebrow">Driver portal</span>
                    <h2 style="margin-top:10px;font-size:1.9rem">Create your charging account</h2>
                </div>
                <div class="register-panel" style="display:block;">
                    <div class="auth-sep">create your driver account</div>
                    <form id="registerForm">
                        <div class="field"><label>First Name</label><input id="regFirstName" placeholder="Jane"
                                required="" type="text" /></div>
                        <div class="field" style="margin-top:10px"><label>Last Name</label><input id="regLastName"
                                placeholder="Doe" required="" type="text" /></div>
                        <div class="field" style="margin-top:10px"><label>Email</label><input id="regEmail"
                                placeholder="jane@example.com" required="" type="email" /></div>
                        <div class="field" style="margin-top:10px; position:relative;"><label>Password</label><input id="regPass" placeholder="••••••••" required="" type="password" style="padding-right:40px;" /><i class="fa-solid fa-eye" style="position:absolute; right:14px; bottom:14px; cursor:pointer; color:var(--muted);" onclick="const i=this.previousElementSibling; if(i.type==='password'){i.type='text';this.classList.replace('fa-eye','fa-eye-slash')}else{i.type='password';this.classList.replace('fa-eye-slash','fa-eye')}"></i></div>
                        <div class="checkrow"><label><input type="checkbox" required="" /> I agree to the <a href="#">Terms of Service</a></label></div>
                        <button class="btn primary" style="width:100%;margin-top:15px" type="submit">Create
                            account</button>
                    </form>
                    <p class="auth-note">Already registered? <a href="login.html">Back to login</a></p>
                </div>
            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>

</html>
